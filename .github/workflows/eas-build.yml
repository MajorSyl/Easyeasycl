name: Build Android APK

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Confirm Expo login
        run: npx eas-cli whoami
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Link EAS project (first run only)
        run: |
          HAS_ID=$(node -p "require('./app.json').expo.extra?.eas?.projectId ? 'yes' : 'no'")
          if [ "$HAS_ID" = "no" ]; then
            echo "No EAS project linked yet — creating one now."
            npx eas-cli init --non-interactive --force
          else
            echo "EAS project already linked, skipping."
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Save the EAS project link back to the repo
        run: |
          if ! git diff --quiet -- app.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add app.json
            git commit -m "chore: link EAS project [skip ci]"
            git push
          else
            echo "Nothing to save."
          fi

      - name: Start Android APK build on EAS (no wait)
        run: |
          npx eas-cli build --platform android --profile preview --non-interactive --no-wait --json > build.json
          cat build.json
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Write build page link to job summary
        run: |
          BUILD_ID=$(jq -r '.[0].id' build.json)
          ACCOUNT=$(jq -r '.[0].project.ownerAccount.name' build.json)
          PROJECT=$(jq -r '.[0].project.name' build.json)
          {
            echo "## Easyfen Android build started"
            echo ""
            echo "The build is running on Expo's servers and usually takes 15-60 minutes on the free tier."
            echo ""
            echo "**Open this page on your phone to watch progress and download the APK when it's done:**"
            echo ""
            echo "https://expo.dev/accounts/${ACCOUNT}/projects/${PROJECT}/builds/${BUILD_ID}"
          } >> "$GITHUB_STEP_SUMMARY"
